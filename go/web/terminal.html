<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <title>Terminal — ServerHub</title>
    <link rel="stylesheet" href="/vendor/xterm.min.css">
  <style>
    :root {
      --accent: #639922;
      --acceptance-green: #4caf50;
      --term-bg: #0e0e10;
      --term-fg: #e0e0e8;

      /* Main app appearance (Settings → General); refreshed from /api/appconfig */
      --app-surface:   hsl(0,0%,22.2%);
      --app-surface2:  hsl(0,0%,24.4%);
      --app-border:    hsl(0,0%,28.9%);
      --app-text:      hsl(0,0%,91%);
      --app-text-muted:hsl(0,0%,62%);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--term-bg);
      overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    #header {
      height: 36px;
      background: var(--app-surface);
      border-bottom: 1px solid var(--app-border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    #header .server-name {
      font-size: 12px;
      color: var(--app-text-muted);
      background: none;
      border: none;
      padding: 2px 5px;
      margin: 0 -5px;
      border-radius: 4px;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    #header .server-name::after {
      content: '▾';
      font-size: 9px;
      margin-left: 5px;
      opacity: 0.7;
    }
    #header .server-name:hover,
    #header .server-name[aria-expanded="true"] {
      color: var(--app-text);
      background: var(--app-surface2);
    }

    .header-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: none;
      color: var(--app-text-muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }
    .header-action:hover,
    .header-action[aria-expanded="true"] {
      color: var(--app-text);
      background: var(--app-surface2);
    }

    #status {
      margin-left: auto;
      font-size: 11px;
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, Menlo, monospace;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(76,175,80,0.15);
      color: var(--acceptance-green);
    }
    #status.disconnected {
      background: rgba(229,57,53,0.1);
      color: #e53935;
    }

    #term-container {
      height: calc(100vh - 36px);
      padding: 8px;
    }

    /* Override xterm cursor color to use accent */
    .xterm-cursor-layer .xterm-cursor {
      background: var(--accent) !important;
    }

    /* Per-machine terminal color dropdown */
    #theme-menu {
      position: fixed;
      z-index: 30;
      width: 296px;
      background: var(--app-surface);
      border: 1px solid var(--app-border);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }
    #theme-menu[hidden] { display: none; }
    .tm-title {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--app-text);
    }
    .tm-sub {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      color: var(--app-text-muted);
    }
    .tm-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
    }
    .tm-label {
      width: 76px;
      flex-shrink: 0;
      font-size: 11px;
      color: var(--app-text-muted);
    }
    .tm-color {
      -webkit-appearance: none;
      appearance: none;
      width: 34px;
      height: 26px;
      padding: 2px;
      border: 1px solid var(--app-border);
      border-radius: 5px;
      background: var(--app-surface2);
      cursor: pointer;
      flex-shrink: 0;
    }
    .tm-color::-webkit-color-swatch-wrapper { padding: 0; }
    .tm-color::-webkit-color-swatch { border: none; border-radius: 2px; }
    .tm-color::-moz-color-swatch { border: none; border-radius: 2px; }
    .tm-hex {
      flex: 1;
      min-width: 0;
      background: var(--app-surface2);
      border: 1px solid var(--app-border);
      border-radius: 4px;
      color: var(--app-text);
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, Menlo, monospace;
      font-size: 11px;
      padding: 5px 7px;
      outline: none;
      text-transform: uppercase;
    }
    .tm-hex:focus { border-color: var(--app-text-muted); }
    .tm-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--app-border);
    }
    .tm-hint {
      font-size: 10px;
      color: var(--app-text-muted);
    }
    .tm-hint.custom { color: var(--acceptance-green); }
    .tm-reset {
      background: none;
      border: 1px solid var(--app-border);
      border-radius: 4px;
      color: var(--app-text);
      font-family: inherit;
      font-size: 11px;
      padding: 4px 9px;
      cursor: pointer;
    }
    .tm-reset:hover:not(:disabled) { background: var(--app-surface2); }
    .tm-reset:disabled { opacity: 0.4; cursor: default; }

    /* Actions dropdown (three dots) */
    #actions-menu {
      position: fixed;
      z-index: 30;
      width: 244px;
      background: var(--app-surface);
      border: 1px solid var(--app-border);
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }
    #actions-menu[hidden] { display: none; }
    .am-item {
      display: block;
      width: 100%;
      padding: 7px 8px;
      border: none;
      border-radius: 5px;
      background: none;
      color: var(--app-text);
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }
    .am-item:hover { background: var(--app-surface2); }
    .am-label {
      display: block;
      font-size: 12px;
      line-height: 1.3;
    }
    .am-sub {
      display: block;
      margin-top: 1px;
      font-size: 10px;
      line-height: 1.35;
      color: var(--app-text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .am-sep {
      height: 1px;
      margin: 5px 6px;
      background: var(--app-border);
    }
    .am-section {
      padding: 5px 8px 3px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--app-text-muted);
    }
    .am-empty {
      padding: 3px 8px 6px;
      font-size: 11px;
      color: var(--app-text-muted);
    }
    .am-note {
      margin: 5px 4px 2px;
      padding: 5px 7px;
      border-radius: 4px;
      background: var(--app-surface2);
      font-size: 10px;
      color: var(--app-text-muted);
    }
    .am-note[hidden] { display: none; }
  </style>
</head>
<body>
<div id="header">
  <button type="button" class="server-name" id="server-name" aria-haspopup="true" aria-expanded="false"
          title="Customize this machine's terminal">terminal</button>
  <button type="button" class="header-action" id="actions-btn" aria-haspopup="true" aria-expanded="false"
          title="Terminal actions" aria-label="Terminal actions">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <circle cx="8" cy="3" r="1.4"></circle>
      <circle cx="8" cy="8" r="1.4"></circle>
      <circle cx="8" cy="13" r="1.4"></circle>
    </svg>
  </button>
  <span id="status">connecting…</span>
</div>

<div id="actions-menu" role="menu" aria-label="Terminal actions" hidden>
  <button type="button" class="am-item" id="am-handoff" role="menuitem">
    <span class="am-label">Terminal handoff</span>
    <span class="am-sub" id="am-handoff-sub">Copy SSH command</span>
  </button>
  <button type="button" class="am-item" id="am-sudo" role="menuitem">
    <span class="am-label">Start sudo shell</span>
    <span class="am-sub">Run sudo -i in this terminal</span>
  </button>
  <button type="button" class="am-item" id="am-clear" role="menuitem">
    <span class="am-label">Clear terminal</span>
    <span class="am-sub">Keep the session, clear scrollback</span>
  </button>
  <div class="am-sep" id="am-quick-sep"></div>
  <div class="am-section" id="am-quick-section">Quick actions</div>
  <div id="am-quick"></div>
  <div class="am-note" id="am-note" hidden></div>
</div>

<div id="theme-menu" role="dialog" aria-label="Terminal colors" hidden>
  <span class="tm-title">Terminal colors</span>
  <span class="tm-sub" id="tm-target">This Machine</span>
  <div class="tm-row">
    <label class="tm-label" for="tm-bg">Background</label>
    <input type="color" class="tm-color" id="tm-bg" value="#0e0e10">
    <input type="text" class="tm-hex" id="tm-bg-hex" value="#0e0e10" maxlength="7" spellcheck="false" autocomplete="off">
  </div>
  <div class="tm-row">
    <label class="tm-label" for="tm-fg">Default text</label>
    <input type="color" class="tm-color" id="tm-fg" value="#e0e0e8">
    <input type="text" class="tm-hex" id="tm-fg-hex" value="#e0e0e8" maxlength="7" spellcheck="false" autocomplete="off">
  </div>
  <div class="tm-row">
    <label class="tm-label" for="tm-accent">Accent</label>
    <input type="color" class="tm-color" id="tm-accent" value="#639922">
    <input type="text" class="tm-hex" id="tm-accent-hex" value="#639922" maxlength="7" spellcheck="false" autocomplete="off">
  </div>
  <div class="tm-footer">
    <span class="tm-hint" id="tm-hint">Using global defaults</span>
    <button type="button" class="tm-reset" id="tm-reset" disabled>Reset</button>
  </div>
</div>

<div id="term-container"></div>

<script src="/vendor/xterm.min.js"></script>
<script src="/vendor/xterm-addon-fit.min.js"></script>
<script>
(async () => {
  // Extract server id from path: /terminal/:id
  const pathParts = window.location.pathname.split('/');
  const serverId = pathParts[pathParts.length - 1];
  const isLocal = serverId === '__local__';
  const jobId = new URLSearchParams(window.location.search).get('job');

  document.getElementById('server-name').textContent = isLocal ? 'This Machine' : serverId;
  document.title = `${isLocal ? 'This Machine' : serverId}${jobId ? ` — job ${jobId}` : ''} — Terminal`;

  // Pre-check access before opening the WebSocket: a failed WS handshake
  // surfaces no HTTP status in the browser, so this gives a clean redirect when
  // the first-run wizard hasn't completed or the session is gone/expired.
  // (Opt-out instances pass everything through and need no session.)
  const goToLogin = () => {
    location.href = '/login?next=' + encodeURIComponent(location.pathname);
  };
  try {
    const r = await fetch('/api/auth/status');
    const s = await r.json();
    if (!s.onboarding_complete || (s.auth_required && !s.authenticated)) {
      goToLogin();
      return;
    }
  } catch (_) {
    goToLogin();
    return;
  }

  // Server details for the actions menu (SSH handoff + quick actions).
  let serverInfo = null;
  if (!isLocal) {
    try {
      const list = await fetch('/api/servers').then(r => r.json());
      if (Array.isArray(list)) serverInfo = list.find(s => s.id === serverId) || null;
    } catch (_) {}
  }

  // Main-app palette maths — mirrors app.js shadeSurfaceVars so the terminal
  // chrome (top bar + menu) follows Settings → General.
  const _lin = (v) => v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  const _srgb = (y) => y <= 0.0031308 ? y * 12.92 : 1.055 * Math.pow(y, 1 / 2.4) - 0.055;
  const _greyY = (l) => _lin(l / 100);
  const _greyL = (y) => _srgb(Math.max(0, Math.min(1, y))) * 100;
  const _tierL = (y, target, dark) =>
    _greyL(dark ? target * (y + 0.05) - 0.05 : (y + 0.05) / target - 0.05);
  const SEAM = _greyL(Math.sqrt(1.05 * 0.05) - 0.05);

  function applyMainAppearance(hue, shade) {
    const bg = Math.max(2, Math.min(100, shade));
    const dark = bg <= SEAM;
    const t = dark ? 1 - bg / SEAM : (bg - SEAM) / (100 - SEAM);
    const mag = 0.4 + 0.6 * t;
    const sign = dark ? 1 : -1;
    const hug = (x) => sign * mag * x;
    const pc = (l) => Math.round(l * 10) / 10;

    const surface  = bg + hug(3);
    const surface2 = bg + hug(6);
    const border   = bg + hug(12);
    const textL    = dark ? Math.max(91, _tierL(_greyY(surface2), 4.55, true))
                          : Math.min(9,  _tierL(_greyY(surface2), 4.55, false));
    const mutedL   = _tierL(_greyY(surface), 4.55, dark);

    const s = document.documentElement.style;
    s.setProperty('--app-surface',    `hsl(0,0%,${pc(surface)}%)`);
    s.setProperty('--app-surface2',   `hsl(0,0%,${pc(surface2)}%)`);
    s.setProperty('--app-border',     `hsl(0,0%,${pc(border)}%)`);
    s.setProperty('--app-text',       `hsl(0,0%,${pc(textL)}%)`);
    s.setProperty('--app-text-muted', `hsl(0,0%,${pc(mutedL)}%)`);
  }

  applyMainAppearance(120, 20);

  // Colors: global defaults from Settings, plus an optional per-machine
  // override editable from the drop-down under the machine name.
  const DEFAULTS = { background: '#0e0e10', foreground: '#e0e0e8', accent: '#639922' };
  const normalize = (v, fallback) => {
    if (typeof v !== 'string' || !/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) return fallback;
    v = v.toLowerCase();
    return v.length === 4
      ? '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3]
      : v;
  };
  const colorsFrom = (cfg, fallback) => ({
    background: normalize(cfg && cfg.background, fallback.background),
    foreground: normalize(cfg && cfg.foreground, fallback.foreground),
    accent:     normalize(cfg && cfg.accent, fallback.accent),
  });
  const terminalUrl = '/api/terminal/config/' + encodeURIComponent(serverId);

  let globalColors = { ...DEFAULTS };
  try {
    const cfg = await fetch('/api/appconfig').then(r => r.json());
    if (cfg.terminal) globalColors = colorsFrom(cfg.terminal, DEFAULTS);
    applyMainAppearance(
      Number.isFinite(cfg.hue) ? cfg.hue : 120,
      Number.isFinite(cfg.shade) ? cfg.shade : 20
    );
  } catch (_) {}

  let effectiveColors = { ...globalColors };
  let overrideColors = null;
  try {
    const tc = await fetch(terminalUrl).then(r => r.json());
    if (tc.effective) effectiveColors = colorsFrom(tc.effective, globalColors);
    overrideColors = tc.override || null;
  } catch (_) {}

  let term = null;
  const PALETTE = {
    black:       '#1c1c22',
    red:         '#e06c75',
    green:       '#98c379',
    yellow:      '#e5c07b',
    blue:        '#61afef',
    magenta:     '#c678dd',
    cyan:        '#56b6c2',
    white:       '#abb2bf',
    brightBlack: '#4a4a60',
    brightWhite: '#e0e0e8',
  };
  const xtermTheme = (colors) => ({
    ...PALETTE,
    background: colors.background,
    foreground: colors.foreground,
    cursor:     colors.accent,
  });

  function applyColors(colors) {
    effectiveColors = colors;
    document.documentElement.style.setProperty('--accent', colors.accent);
    document.documentElement.style.setProperty('--term-bg', colors.background);
    document.documentElement.style.setProperty('--term-fg', colors.foreground);
    if (term) term.options.theme = xtermTheme(colors);
  }

  applyColors(effectiveColors);

  term = new Terminal({
    fontFamily: 'ui-monospace, "Cascadia Code", "Fira Code", Consolas, Menlo, monospace',
    fontSize: 14,
    lineHeight: 1.25,
    cursorBlink: true,
    cursorStyle: 'block',
    theme: xtermTheme(effectiveColors),
    scrollback: 5000,
    allowTransparency: false,
  });

  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('term-container'));
  fitAddon.fit();

  // ── Per-machine color menu ────────────────────────────────────────────────
  const nameBtn   = document.getElementById('server-name');
  const menu      = document.getElementById('theme-menu');
  const hint      = document.getElementById('tm-hint');
  const resetBtn  = document.getElementById('tm-reset');
  const tmTarget  = document.getElementById('tm-target');
  tmTarget.textContent = isLocal ? 'This Machine' : serverId;

  const fields = {
    background: { color: 'tm-bg',     hex: 'tm-bg-hex' },
    foreground: { color: 'tm-fg',     hex: 'tm-fg-hex' },
    accent:     { color: 'tm-accent', hex: 'tm-accent-hex' },
  };

  function syncMenu() {
    for (const key of Object.keys(fields)) {
      document.getElementById(fields[key].color).value = effectiveColors[key];
      document.getElementById(fields[key].hex).value = effectiveColors[key];
    }
    hint.textContent = overrideColors ? 'Custom for this machine' : 'Using global defaults';
    hint.classList.toggle('custom', !!overrideColors);
    resetBtn.disabled = !overrideColors;
  }

  function positionHeaderMenu(el, anchorEl) {
    const header = document.getElementById('header').getBoundingClientRect();
    const anchor = anchorEl.getBoundingClientRect();
    const left = Math.max(8, Math.min(anchor.left, window.innerWidth - el.offsetWidth - 8));
    el.style.left = left + 'px';
    el.style.top = (header.bottom + 4) + 'px';
  }

  function openMenu() {
    closeActionsMenu();
    syncMenu();
    menu.hidden = false;
    nameBtn.setAttribute('aria-expanded', 'true');
    positionHeaderMenu(menu, nameBtn);
  }

  function closeMenu() {
    menu.hidden = true;
    nameBtn.setAttribute('aria-expanded', 'false');
  }

  nameBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    menu.hidden ? openMenu() : closeMenu();
  });
  document.addEventListener('click', (e) => {
    if (!menu.hidden && !menu.contains(e.target) && !nameBtn.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeMenu();
      closeActionsMenu();
    }
  });

  let saveTimer = null;

  function setOverride(key, value) {
    const v = normalize(value, null);
    if (!v) return;
    overrideColors = overrideColors || {};
    overrideColors[key] = v;
    applyColors({ ...effectiveColors, [key]: v });
    hint.textContent = 'Saving…';
    hint.classList.remove('custom');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveOverride, 450);
  }

  async function saveOverride() {
    try {
      const r = await fetch(terminalUrl, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(overrideColors),
      });
      if (!r.ok) throw new Error();
      const tc = await r.json();
      overrideColors = tc.override || null;
      if (tc.effective) applyColors(colorsFrom(tc.effective, globalColors));
      hint.textContent = 'Custom for this machine';
      hint.classList.add('custom');
      resetBtn.disabled = false;
    } catch (_) {
      hint.textContent = 'Could not save';
      hint.classList.remove('custom');
    }
  }

  for (const key of Object.keys(fields)) {
    const colorEl = document.getElementById(fields[key].color);
    const hexEl = document.getElementById(fields[key].hex);

    colorEl.addEventListener('input', () => {
      const v = normalize(colorEl.value, null);
      if (!v) return;
      hexEl.value = v;
      setOverride(key, v);
    });
    hexEl.addEventListener('input', () => {
      const v = normalize(hexEl.value, null);
      if (!v) return;
      colorEl.value = v;
      setOverride(key, v);
    });
    hexEl.addEventListener('blur', () => {
      hexEl.value = normalize(hexEl.value, effectiveColors[key]);
    });
  }

  resetBtn.addEventListener('click', async () => {
    clearTimeout(saveTimer);
    try {
      const r = await fetch(terminalUrl, {
        method: 'DELETE',
        headers: { 'X-Requested-With': 'XMLHttpRequest' },
      });
      if (!r.ok) throw new Error();
      const tc = await r.json();
      overrideColors = null;
      applyColors(tc.effective ? colorsFrom(tc.effective, globalColors) : { ...globalColors });
      syncMenu();
    } catch (_) {
      hint.textContent = 'Could not reset';
    }
  });

  // ── Actions menu (three dots) ─────────────────────────────────────────────
  const actionsBtn = document.getElementById('actions-btn');
  const actionsMenu = document.getElementById('actions-menu');
  const amNote = document.getElementById('am-note');
  const amQuick = document.getElementById('am-quick');
  const handoffSub = document.getElementById('am-handoff-sub');
  let noteTimer = null;

  function showNote(text) {
    amNote.textContent = text;
    amNote.hidden = false;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { amNote.hidden = true; }, 2200);
  }

  function openActionsMenu() {
    closeMenu();
    actionsMenu.hidden = false;
    actionsBtn.setAttribute('aria-expanded', 'true');
    positionHeaderMenu(actionsMenu, actionsBtn);
  }

  function closeActionsMenu() {
    actionsMenu.hidden = true;
    actionsBtn.setAttribute('aria-expanded', 'false');
  }

  actionsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    actionsMenu.hidden ? openActionsMenu() : closeActionsMenu();
  });
  document.addEventListener('click', (e) => {
    if (!actionsMenu.hidden && !actionsMenu.contains(e.target) && !actionsBtn.contains(e.target)) {
      closeActionsMenu();
    }
  });

  function sshHandoffText() {
    if (isLocal || !serverInfo) return location.href;
    const port = serverInfo.port && serverInfo.port !== 22 ? ' -p ' + serverInfo.port : '';
    return 'ssh' + port + ' ' + serverInfo.user + '@' + serverInfo.host;
  }

  if (isLocal || !serverInfo) {
    handoffSub.textContent = 'Copy this terminal link';
  } else {
    handoffSub.textContent = sshHandoffText();
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (_) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (_) {
      return false;
    }
  }

  document.getElementById('am-handoff').addEventListener('click', async () => {
    const ok = await copyText(sshHandoffText());
    showNote(ok ? 'Copied to clipboard' : 'Could not copy');
    if (ok) setTimeout(closeActionsMenu, 700);
  });

  function runInTerminal(command) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      showNote('Terminal is not connected');
      return;
    }
    closeActionsMenu();
    ws.send(command + '\r');
    term.focus();
  }

  document.getElementById('am-sudo').addEventListener('click', () => {
    runInTerminal('sudo -i');
  });

  document.getElementById('am-clear').addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send('\x0c'); // Ctrl+L: clear + redraw the shell prompt
    } else {
      term.clear();
    }
    closeActionsMenu();
    term.focus();
  });

  // Quick actions from config (remote servers only).
  const quickActions = (!isLocal && serverInfo && Array.isArray(serverInfo.quick_actions))
    ? serverInfo.quick_actions
    : [];
  if (!quickActions.length) {
    document.getElementById('am-quick-sep').hidden = true;
    document.getElementById('am-quick-section').hidden = true;
    amQuick.hidden = true;
  } else {
    for (const qa of quickActions) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'am-item';
      btn.setAttribute('role', 'menuitem');

      const label = document.createElement('span');
      label.className = 'am-label';
      label.textContent = qa.label || 'Quick action';

      const sub = document.createElement('span');
      sub.className = 'am-sub';
      sub.textContent = qa.command || '';

      btn.append(label, sub);
      btn.addEventListener('click', () => runInTerminal(qa.command || ''));
      amQuick.appendChild(btn);
    }
  }

  // WebSocket
  const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const jobQuery = jobId ? `?job=${encodeURIComponent(jobId)}` : '';
  const wsUrl = isLocal
    ? `${proto}://${window.location.host}/api/local/terminal`
    : `${proto}://${window.location.host}/api/server/${serverId}/terminal${jobQuery}`;
  let ws = null;

  function connect() {
    const status = document.getElementById('status');
    status.textContent = 'connecting…';
    status.className = '';

    ws = new WebSocket(wsUrl);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      status.textContent = 'connected';
      status.className = '';
      // Send initial size
      sendResize();
    };

    ws.onmessage = (e) => {
      if (e.data instanceof ArrayBuffer) {
        term.write(new Uint8Array(e.data));
      } else {
        term.write(e.data);
      }
    };

    ws.onclose = () => {
      status.textContent = 'disconnected';
      status.className = 'disconnected';
      term.write('\r\n\x1b[31m[Connection closed]\x1b[0m\r\n');
    };

    ws.onerror = () => {
      status.textContent = 'error';
      status.className = 'disconnected';
    };
  }

  function sendResize() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const dims = fitAddon.proposeDimensions();
    if (!dims) return;
    ws.send(JSON.stringify({ type: 'resize', cols: dims.cols, rows: dims.rows }));
  }

  // Terminal input → WebSocket
  term.onData(data => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(data);
    }
  });

  // Resize handling
  const ro = new ResizeObserver(() => {
    fitAddon.fit();
    sendResize();
  });
  ro.observe(document.getElementById('term-container'));

  window.addEventListener('resize', () => {
    fitAddon.fit();
    sendResize();
  });

  connect();
})();
</script>
</body>
</html>
